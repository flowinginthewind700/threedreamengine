<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400">
  <style>
    text { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .title { fill: #e9e6e0; font-size: 20px; font-weight: 650; }
    .sub { fill: #9aa1ac; font-size: 12.5px; }
    .box { fill: #1b1e24; stroke: #2b3038; }
    .h { fill: #e9e6e0; font-size: 12.5px; font-weight: 650; }
    .d { fill: #9aa1ac; font-size: 11.5px; }
    .n { fill: #4a515c; font-size: 11px; }
    .foot { fill: #6d7480; font-size: 12px; }
    .flow { stroke: #3a424d; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="1440" height="400" fill="#0e1013"/>

  <text class="title" x="36" y="42">From an Unreal project to a browser frame</text>
  <text class="sub" x="36" y="66">the content pipeline behind the UE level demo</text>

  <g>
    <rect class="box" x="36" y="96" width="248" height="208" rx="8"/>
    <rect x="40" y="106" width="3" height="188" rx="1.5" fill="#dd8f3c"/>
    <text class="n mono" x="264" y="126" text-anchor="end">01</text>
    <text class="h" x="58" y="128">UNREAL PROJECT</text>
    <text class="d" x="58" y="162">.umap level stream</text>
    <text class="d" x="58" y="186">.uasset static meshes</text>
    <text class="d" x="58" y="210">skeletal meshes and skins</text>
    <text class="d" x="58" y="234">material graphs</text>
    <text class="d" x="58" y="258">SoundWave and cue assets</text>
  </g>

  <g>
    <rect class="box" x="316" y="96" width="248" height="208" rx="8"/>
    <rect x="320" y="106" width="3" height="188" rx="1.5" fill="#4fb3a5"/>
    <text class="n mono" x="544" y="126" text-anchor="end">02</text>
    <text class="h" x="338" y="128">PACKAGE READER</text>
    <text class="d" x="338" y="162">summary and name tables</text>
    <text class="d" x="338" y="186">import / export tables</text>
    <text class="d" x="338" y="210">typed property tags</text>
    <text class="d" x="338" y="234">Oodle bulk data</text>
    <text class="d" x="338" y="258">compressed buffers</text>
  </g>

  <g>
    <rect class="box" x="596" y="96" width="248" height="208" rx="8"/>
    <rect x="600" y="106" width="3" height="188" rx="1.5" fill="#4fb3a5"/>
    <text class="n mono" x="824" y="126" text-anchor="end">03</text>
    <text class="h" x="618" y="128">INTERPRETATION</text>
    <text class="d" x="618" y="162">MeshDescription to vertices</text>
    <text class="d" x="618" y="186">material graph to a bake</text>
    <text class="d" x="618" y="210">actors to placements</text>
    <text class="d" x="618" y="234">cues to an audio graph</text>
    <text class="d" x="618" y="258">radiance to a sun bearing</text>
  </g>

  <g>
    <rect class="box" x="876" y="96" width="248" height="208" rx="8"/>
    <rect x="880" y="106" width="3" height="188" rx="1.5" fill="#dd8f3c"/>
    <text class="n mono" x="1104" y="126" text-anchor="end">04</text>
    <text class="h" x="898" y="128">MANIFESTS</text>
    <text class="d" x="898" y="162">JSON and .glb, committed</text>
    <text class="d mono" x="898" y="186">npm run ue-extract</text>
    <text class="d" x="898" y="210">reproduces them exactly</text>
    <text class="d" x="898" y="234">provenance is an artifact,</text>
    <text class="d" x="898" y="258">not a comment</text>
  </g>

  <g>
    <rect class="box" x="1156" y="96" width="248" height="208" rx="8"/>
    <rect x="1160" y="106" width="3" height="188" rx="1.5" fill="#e9e6e0"/>
    <text class="n mono" x="1384" y="126" text-anchor="end">05</text>
    <text class="h" x="1178" y="128">BROWSER RUNTIME</text>
    <text class="d" x="1178" y="162">placements into the ECS</text>
    <text class="d" x="1178" y="186">three.js materials and lights</text>
    <text class="d" x="1178" y="210">WebAudio voices</text>
    <text class="d" x="1178" y="234">a deterministic match,</text>
    <text class="d" x="1178" y="258">played and trainable</text>
  </g>

  <path class="flow" d="M288 200 L306 200"/>
  <path d="M312 200 l-7 -4.5 v9 z" fill="#3a424d"/>
  <path class="flow" d="M568 200 L586 200"/>
  <path d="M592 200 l-7 -4.5 v9 z" fill="#3a424d"/>
  <path class="flow" d="M848 200 L866 200"/>
  <path d="M872 200 l-7 -4.5 v9 z" fill="#3a424d"/>
  <path class="flow" d="M1128 200 L1146 200"/>
  <path d="M1152 200 l-7 -4.5 v9 z" fill="#3a424d"/>

  <text class="foot" x="36" y="346" fill="#9aa1ac">No Unreal build, no editor and no proprietary runtime in the loop: the bytes an engine already wrote are read directly.</text>
  <text class="foot" x="36" y="370">The reader lives in src/assets/ue/ and the importer in scripts/; what they write is committed, so a browser needs no toolchain to play the level.</text>
</svg>
